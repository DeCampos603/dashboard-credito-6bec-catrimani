name: Disparo Diário de Relatório Orçamentário (Ação 21EM · 6º BEC / Multi-UG)

# Disparo automatizado diário do Relatório de Execução Orçamentária e Crédito
# Operação Catrimani II (Ação Governamental 21EM) — 6º BEC e Multi-UGs
# Governança: TC Int Saldanha - D10

on:
  schedule:
    # Segunda a sexta-feira às 11:00 UTC (08:00 Horário de Brasília)
    - cron: "0 11 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Executar em modo simulado (Dry-run sem envio real de e-mail)"
        required: false
        default: "false"
        type: boolean
      email_destino_custom:
        description: "E-mail de destino alternativo para teste (opcional)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  dispatch_budget_report:
    name: Compilar e Disparar Relatório Orçamentário
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Ambiente Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar Dependências do Extrator
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Processar Dados e Disparar Mensagem Executiva
        env:
          # Configurações de Conexão SMTP
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER || secrets.EMAIL_REMETENTE }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD || secrets.EMAIL_SENHA }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE || secrets.SMTP_USER }}
          EMAIL_SENHA: ${{ secrets.EMAIL_SENHA || secrets.SMTP_PASSWORD }}
          EMAIL_DESTINO: ${{ inputs.email_destino_custom != '' && inputs.email_destino_custom || secrets.EMAIL_DESTINO || 'marcelofsaldanha@gmail.com' }}
          EMAIL_BCC: ${{ secrets.EMAIL_BCC }}
          
          # Insumo de Dados (Planilha Tesouro Gerencial / SIAFI)
          SHEETS_CSV_URL: ${{ secrets.SHEETS_CSV_URL }}
          DRIVE_FILE_ID: ${{ secrets.DRIVE_FILE_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "[INFO] Executando em modo DRY-RUN..."
            python relatorio_email_6bec.py --dry-run
          else
            echo "[INFO] Executando disparo oficial do relatório..."
            python relatorio_email_6bec.py
          fi
