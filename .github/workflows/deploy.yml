name: Atualizar Dashboard 6º BEC & Catrimani II

# Roda diariamente às 11:00 UTC (08:00 BRT), sob demanda e em push na main
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar o dashboard
        env:
          DRIVE_FILE_ID: ${{ secrets.DRIVE_FILE_ID }}
          SHEETS_CSV_URL: ${{ secrets.SHEETS_CSV_URL }}
        run: python gerar_dashboard.py

      - name: Enviar Relatório Executivo Diário (WhatsApp Format)
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER || secrets.EMAIL_REMETENTE }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD || secrets.EMAIL_SENHA }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE || secrets.SMTP_USER }}
          EMAIL_SENHA: ${{ secrets.EMAIL_SENHA || secrets.SMTP_PASSWORD }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO || 'marcelofsaldanha@gmail.com' }}
          EMAIL_BCC: ${{ secrets.EMAIL_BCC }}
          SHEETS_CSV_URL: ${{ secrets.SHEETS_CSV_URL }}
        run: python relatorio_email_6bec.py

      - name: Salvar histórico (commit se mudou)
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if git diff --staged --quiet; then
            echo "Sem mudança no histórico."
          else
            git commit -m "Atualiza histórico diário [skip ci]"
            git push
          fi

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empacotar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
